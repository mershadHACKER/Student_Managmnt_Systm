<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Reports</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            color: #333;
        }


        .container {

            width: 90%;

            max-width: 1100px;

            margin: 40px auto;

        }


        h1 {
            margin-bottom: 5px;
        }


        .subtitle {

            color: #666;

            margin-bottom: 30px;

        }


        /* =========================
           SUMMARY CARDS
        ========================= */

        .summary {

            display: flex;

            gap: 20px;

            margin-bottom: 30px;

        }


        .card {

            background: white;

            padding: 20px;

            flex: 1;

            border-radius: 8px;

            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.1);

        }


        .card h3 {

            margin-top: 0;

            color: #555;

            font-size: 16px;

        }


        .card p {

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 0;

            color: #2563eb;

        }


        /* =========================
           FILTERS
        ========================= */

        .filters {

            background: white;

            padding: 20px;

            display: flex;

            gap: 15px;

            margin-bottom: 20px;

            border-radius: 8px;

            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.05);

        }


        .filters input,
        .filters select {

            padding: 10px;

            border: 1px solid #ccc;

            border-radius: 5px;

            flex: 1;

            font-size: 14px;

        }


        button {

            padding: 10px 20px;

            border: none;

            border-radius: 5px;

            background: #2563eb;

            color: white;

            cursor: pointer;

            font-size: 14px;

        }


        button:hover {

            background: #1d4ed8;

        }


        /* =========================
           TABLE
        ========================= */

        .table-container {

            overflow-x: auto;

            background: white;

            border-radius: 8px;

        }


        table {

            width: 100%;

            border-collapse: collapse;

        }


        th,
        td {

            padding: 12px;

            border-bottom: 1px solid #ddd;

            text-align: left;

        }


        th {

            background: #2563eb;

            color: white;

        }


        tr:hover {

            background: #f5f5f5;

        }


        /* =========================
           STATUS
        ========================= */

        .pass {

            color: green;

            font-weight: bold;

        }


        .fail {

            color: red;

            font-weight: bold;

        }


        .low {

            color: red;

            font-weight: bold;

        }


        .good {

            color: green;

            font-weight: bold;

        }


        /* =========================
           NO DATA
        ========================= */

        .no-data {

            text-align: center;

            padding: 30px;

            color: #777;

        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 700px) {

            .summary {

                flex-direction: column;

            }


            .filters {

                flex-direction: column;

            }


            table {

                font-size: 12px;

            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================
         PAGE HEADER
    ========================= -->

    <h1>Student Reports</h1>

    <p class="subtitle">

        View student academic and attendance reports

    </p>


    <!-- =========================
         SUMMARY
    ========================= -->

    <div class="summary">


        <div class="card">

            <h3>Total Students</h3>

            <p id="totalStudents">
                0
            </p>

        </div>


        <div class="card">

            <h3>Average Marks</h3>

            <p id="averageMarks">
                0%
            </p>

        </div>


        <div class="card">

            <h3>Average Attendance</h3>

            <p id="averageAttendance">
                0%
            </p>

        </div>


        <div class="card">

            <h3>Low Attendance</h3>

            <p id="lowAttendance">
                0
            </p>

        </div>


    </div>


    <!-- =========================
         FILTERS
    ========================= -->

    <div class="filters">


        <input
            type="text"
            id="search"
            placeholder="Search student..."
        >


        <select id="classFilter">

            <option value="all">
                All Classes
            </option>

            <option value="BCA S3">
                BCA S3
            </option>

            <option value="BCA S4">
                BCA S4
            </option>

        </select>


        <button onclick="generateReport()">

            Generate Report

        </button>


    </div>


    <!-- =========================
         REPORT TABLE
    ========================= -->

    <div class="table-container">


        <table>


            <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Class</th>

                    <th>Marks</th>

                    <th>Attendance</th>

                    <th>Status</th>

                </tr>

            </thead>


            <tbody id="reportTable">

            </tbody>


        </table>


    </div>


</div>



<script>


    /*
     * STUDENT DATA
     *
     * This is sample data.
     * Later this can be replaced
     * with database/API data.
     */

    const students = [

        {
            id: "ST001",
            name: "Arjun Kumar",
            className: "BCA S3",
            marks: 85,
            attendance: 92
        },

        {
            id: "ST002",
            name: "Ananya Nair",
            className: "BCA S3",
            marks: 91,
            attendance: 88
        },

        {
            id: "ST003",
            name: "Rahul Raj",
            className: "BCA S3",
            marks: 68,
            attendance: 71
        },

        {
            id: "ST004",
            name: "Meera Joseph",
            className: "BCA S4",
            marks: 94,
            attendance: 96
        },

        {
            id: "ST005",
            name: "Vishnu S",
            className: "BCA S4",
            marks: 55,
            attendance: 64
        },

        {
            id: "ST006",
            name: "Diya Menon",
            className: "BCA S4",
            marks: 88,
            attendance: 90
        }

    ];



    /*
     * GENERATE REPORT
     */

    function generateReport() {


        const search =
            document
            .getElementById("search")
            .value
            .toLowerCase()
            .trim();


        const classFilter =
            document
            .getElementById("classFilter")
            .value;



        /*
         * FILTER STUDENTS
         */

        const filteredStudents =
            students.filter(student => {


                const matchesSearch =

                    student.name
                    .toLowerCase()
                    .includes(search)

                    ||

                    student.id
                    .toLowerCase()
                    .includes(search);



                const matchesClass =

                    classFilter === "all"

                    ||

                    student.className === classFilter;



                return (
                    matchesSearch &&
                    matchesClass
                );

            });



        /*
         * DISPLAY DATA
         */

        displayStudents(
            filteredStudents
        );



        /*
         * UPDATE SUMMARY
         */

        updateSummary(
            filteredStudents
        );

    }



    /*
     * DISPLAY STUDENTS
     */

    function displayStudents(studentList) {


        const table =
            document.getElementById(
                "reportTable"
            );


        table.innerHTML = "";



        /*
         * No data
         */

        if (studentList.length === 0) {

            table.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        class="no-data"
                    >

                        No students found.

                    </td>

                </tr>

            `;

            return;

        }



        /*
         * Add students
         */

        studentList.forEach(student => {


            const row =
                document.createElement("tr");



            /*
             * Determine pass/fail
             */

            const status =
                student.marks >= 40
                ? "Pass"
                : "Fail";


            const statusClass =
                student.marks >= 40
                ? "pass"
                : "fail";



            /*
             * Determine attendance
             */

            const attendanceClass =
                student.attendance >= 75
                ? "good"
                : "low";



            row.innerHTML = `

                <td>
                    ${student.id}
                </td>

                <td>
                    ${student.name}
                </td>

                <td>
                    ${student.className}
                </td>

                <td>
                    ${student.marks}%
                </td>

                <td
                    class="${attendanceClass}"
                >
                    ${student.attendance}%
                </td>

                <td
                    class="${statusClass}"
                >
                    ${status}
                </td>

            `;



            table.appendChild(row);

        });

    }



    /*
     * UPDATE SUMMARY
     */

    function updateSummary(studentList) {


        const total =
            studentList.length;



        /*
         * Total students
         */

        document.getElementById(
            "totalStudents"
        ).textContent = total;



        /*
         * No students
         */

        if (total === 0) {

            document.getElementById(
                "averageMarks"
            ).textContent = "0%";


            document.getElementById(
                "averageAttendance"
            ).textContent = "0%";


            document.getElementById(
                "lowAttendance"
            ).textContent = "0";


            return;

        }



        /*
         * Calculate total marks
         */

        const totalMarks =
            studentList.reduce(

                (sum, student) =>

                    sum + student.marks,

                0

            );



        /*
         * Calculate total attendance
         */

        const totalAttendance =
            studentList.reduce(

                (sum, student) =>

                    sum + student.attendance,

                0

            );



        /*
         * Calculate averages
         */

        const averageMarks =
            totalMarks / total;


        const averageAttendance =
            totalAttendance / total;



        /*
         * Calculate low attendance
         */

        const lowAttendance =
            studentList.filter(

                student =>
                    student.attendance < 75

            ).length;



        /*
         * Update page
         */

        document.getElementById(
            "averageMarks"
        ).textContent =

            averageMarks.toFixed(1) + "%";



        document.getElementById(
            "averageAttendance"
        ).textContent =

            averageAttendance.toFixed(1) + "%";



        document.getElementById(
            "lowAttendance"
        ).textContent =

            lowAttendance;

    }



    /*
     * GENERATE REPORT
     * WHEN PAGE LOADS
     */

    generateReport();


</script>


</body>

</html>
```
